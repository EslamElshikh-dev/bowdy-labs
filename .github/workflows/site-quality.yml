name: Site quality checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "build.mjs"
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/site-quality.yml"

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Build and validate BOWDY LABS
        run: npm run check
