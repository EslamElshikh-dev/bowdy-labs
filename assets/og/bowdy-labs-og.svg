<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BOWDY LABS</title>
  <desc id="desc">Intelligence. Innovation. Impact.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B18"/>
      <stop offset=".55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#171B3D"/>
    </linearGradient>
    <linearGradient id="bowdy-grad" x1="760" y1="520" x2="1110" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C5CE7"/>
      <stop offset=".55" stop-color="#5B72F2"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
