  <text x="85" y="276" fill="#00D4FF" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="7">INTELLIGENCE. INNOVATION. IMPACT.</text>
  <text x="85" y="395" fill="#AAB6D2" font-family="Arial, sans-serif" font-size="27">AI · SOFTWARE · CYBERSECURITY · CLOUD</text>
  <g filter="url(#glow)">
