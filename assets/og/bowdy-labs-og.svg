  <circle cx="954" cy="300" r="258" fill="#5B72F2" fill-opacity=".08"/>
  <circle cx="1042" cy="416" r="180" fill="#6C5CE7" fill-opacity=".08"/>
  <path d="M0 510C280 430 460 610 780 504S1050 462 1200 498" fill="none" stroke="#00D4FF" stroke-opacity=".14"/>
