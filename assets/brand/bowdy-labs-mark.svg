<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="title desc">
  <title id="title">Bowdy Labs SparkNode mark</title>
  <desc id="desc">The original Bowdy Labs mark formed from a violet-to-cyan intelligence node and a connected cyan node.</desc>
  <defs>
    <linearGradient id="bowdy-grad" x1="0" y1="48" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C5CE7"/>
      <stop offset=".55" stop-color="#5B72F2"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>
  <circle cx="21" cy="26" r="17" fill="url(#bowdy-grad)"/>
  <circle cx="38" cy="11" r="8.5" fill="#00D4FF" stroke="#0F172A" stroke-width="3"/>
</svg>
